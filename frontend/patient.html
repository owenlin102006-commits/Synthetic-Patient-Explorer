
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>病人詳細資料 | Synthetic Patient Explorer</title>

    <link rel="stylesheet" href="style.css?v=detail-nav-center">
</head>

<body>
    <header class="site-header">
        <h1 data-i18n="detailTitle">病人詳細資料</h1>
        <p>Synthetic Patient Explorer</p>

        <button id="languageBtn" type="button">
            English
        </button>
    </header>

    <details id="detailNav" class="detail-nav">
        <summary><span data-i18n="sectionNav">目錄</span></summary>
        <nav aria-labelledby="detailNavTitle">
            <span id="detailNavTitle" hidden data-i18n="sectionNav">目錄</span>
            <a href="#basic-info" data-i18n="basicInfo">基本資料</a>
            <a href="#encounter-history" data-i18n="encounterHistory">就診時間軸</a>
            <a href="#observations" data-i18n="observationsTitle">檢驗與觀察紀錄</a>
            <a href="#medications" data-i18n="medicationsTitle">用藥紀錄</a>
        </nav>
    </details>

    <main>
        <section>
            <a href="index.html" id="backLink"
               data-i18n="back">
                ← 返回病人清單
            </a>
        </section>

        <section id="basic-info" class="detail-section" tabindex="-1">
            <h2 data-i18n="basicInfo">基本資料</h2>

            <div id="patientInfo">
                正在載入病人資料...
            </div>
        </section>

        <section id="encounter-history" class="detail-section" tabindex="-1">
            <h2 data-i18n="encounterHistory">
                就診時間軸
            </h2>

            <div class="encounter-controls">
                <label for="encounterSort">
                    <span data-i18n="encounterSort">日期排序</span>
                    <select id="encounterSort" disabled>
                        <option value="newest" data-i18n="newestFirst">由新到舊</option>
                        <option value="oldest" data-i18n="oldestFirst">由舊到新</option>
                    </select>
                </label>

                <label for="encounterType">
                    <span data-i18n="encounterType">就診類型</span>
                    <select id="encounterType" disabled>
                        <option value="" data-i18n="allEncounterTypes">全部類型</option>
                    </select>
                </label>
            </div>

            <p id="encounterCount" aria-live="polite"></p>

            <div id="encounterTimeline">
                正在載入就診紀錄...
            </div>
        </section>

        <section id="observations" class="detail-section" tabindex="-1">
            <h2 data-i18n="observationsTitle">
                檢驗與觀察紀錄
            </h2>

            <p id="observationCount"></p>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th data-i18n="date">日期</th>
                            <th data-i18n="observationName">項目</th>
                            <th data-i18n="value">數值</th>
                            <th data-i18n="unit">單位</th>
                        </tr>
                    </thead>
                    <tbody id="observationTableBody">
                    </tbody>
                </table>
            </div>
        </section>

        <section id="medications" class="detail-section" tabindex="-1">
            <h2 data-i18n="medicationsTitle">
                用藥紀錄
            </h2>

            <p id="medicationCount"></p>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th data-i18n="startDate">開始日期</th>
                            <th data-i18n="endDate">結束日期</th>
                            <th data-i18n="medicationName">藥品名稱</th>
                            <th data-i18n="dispenses">領藥次數</th>
                        </tr>
                    </thead>
                    <tbody id="medicationTableBody">
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    

    <script src="site-header.js"></script>
    <script src="patient.js?v=detail-nav"></script>
</body>
</html>
